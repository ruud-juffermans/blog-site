---
layout: page
# Project overview: the same cards as the home page, one per item in _projects.
---

{{ content }}

<div id="post-list" class="flex-grow-1 px-xl-1">
  {% for project in site.projects %}
    <article class="card-wrapper card">
      <a href="{{ project.url | relative_url }}" class="post-preview row g-0 flex-md-row-reverse">
        {% if project.image %}
          <div class="col-md-5">
            <img src="{{ project.image | relative_url }}" alt="{{ project.title | escape }}">
          </div>
        {% endif %}
        <div class="{% if project.image %}col-md-7{% else %}col-md-12{% endif %}">
          <div class="card-body d-flex flex-column">
            <h1 class="card-title my-2 mt-md-0">{{ project.title }}</h1>
            <div class="card-text content mt-0 mb-3">
              <p>{{ project.description }}</p>
            </div>
            <div class="post-meta flex-grow-1 d-flex align-items-end">
              <div class="me-auto">
                <i class="fas fa-code fa-fw me-1"></i>
                <span>{{ project.stack | join: ' · ' }}</span>
              </div>
            </div>
          </div>
        </div>
      </a>
    </article>
  {% endfor %}
</div>
