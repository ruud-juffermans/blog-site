server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at Traefik; keep redirects relative so they stay on https.
    absolute_redirect off;

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml
               application/atom+xml image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The service worker and its manifest must always be revalidated,
    # otherwise visitors keep an old offline cache after a deploy.
    location ~* ^/(sw(\.min)?\.js|app\.min\.js|assets/js/data/.*)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
