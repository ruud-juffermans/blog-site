name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the site and check every internal link/image resolves.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # _plugins/posts-lastmod-hook.rb reads git history

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

  # The image Dokploy will build must build here first.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t blog-site .

  # Production deploy: Dokploy pulls main and rebuilds the Dockerfile when its
  # webhook is called. Only after every check passed on a push to main.
  # DOKPLOY_WEBHOOK_URL is a repository secret (application → Deployments → Webhook URL).
  deploy:
    runs-on: ubuntu-latest
    needs: [check, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://blog.ruudjuffermans.nl
    steps:
      - name: Trigger Dokploy deploy
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DOKPLOY_WEBHOOK_URL secret is not set; skipping deploy."
            exit 0
          fi
          response=$(curl --fail --silent --show-error -X POST "$WEBHOOK_URL" \
            -H "content-type: application/json" \
            -H "x-github-event: push" \
            -d "{\"ref\":\"${GITHUB_REF}\",\"after\":\"${GITHUB_SHA}\"}")
          echo "Dokploy: $response"
          case "$response" in
            *"Not Match"*|*"not found"*|*"error"*)
              echo "::error::Dokploy did not start a deploy: $response"; exit 1 ;;
          esac
